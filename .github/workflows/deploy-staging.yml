name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ENVIRONMENT: staging

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      packages: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set_tag.outputs.tag }} || {
            echo "Error: Image tag ${{ steps.set_tag.outputs.tag }} not found"
            exit 1
          }

      - name: Create deployment
        id: deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: staging
          initial-status: in_progress

      - name: Deploy to staging environment
        id: deploy
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set_tag.outputs.tag }} to staging..."

          # Create deployment manifest
          cat > /tmp/deploy-staging.yaml << EOF
          # Kubernetes/Docker Compose deployment manifest
          # This is a placeholder - customize for your infrastructure

          # For Docker Compose deployment:
          # docker-compose -f docker-compose.staging.yml pull
          # docker-compose -f docker-compose.staging.yml up -d

          # For Kubernetes deployment:
          # kubectl set image deployment/arctic-text2sql \
          #   app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set_tag.outputs.tag }} \
          #   -n staging

          # For AWS ECS deployment:
          # aws ecs update-service --cluster staging --service arctic-text2sql \
          #   --force-new-deployment
          EOF

          echo "Deployment manifest created at /tmp/deploy-staging.yaml"
          echo "url=https://staging.text2sql.example.com" >> $GITHUB_OUTPUT
          echo "Staging deployment completed successfully"

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: ${{ steps.deploy.outputs.url }}

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure

  smoke-test:
    name: Staging Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging environment..."

          # Health check
          # curl -f https://staging.text2sql.example.com/api/v1/health || exit 1

          # Basic API test
          # curl -f -X POST https://staging.text2sql.example.com/api/v1/validate \
          #   -H "Content-Type: application/json" \
          #   -d '{"sql": "SELECT 1"}' || exit 1

          echo "Smoke tests passed (placeholder - configure actual endpoints)"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Smoke tests failed on staging deployment"
          # Add notification logic here (Slack, email, etc.)
