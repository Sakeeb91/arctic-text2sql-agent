# Arctic Text2SQL - PostgreSQL Replica Authentication
# Read replica configuration (no replication entries needed for pure replica)

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local connections
local   all             all                                     trust

# IPv4 local connections
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local connections
host    all             all             ::1/128                 scram-sha-256

# Docker network connections (API servers - read queries)
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256

# Allow cascading replication if needed
host    replication     replicator      172.16.0.0/12           scram-sha-256
