# Arctic Text2SQL - PostgreSQL Replica Configuration
# Hot standby replica for read scaling and failover

# ==========================================================================
# Connection Settings
# ==========================================================================
listen_addresses = '*'
port = 5432
max_connections = 200

# ==========================================================================
# Memory Settings (same as primary)
# ==========================================================================
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB
huge_pages = try

# ==========================================================================
# Replica/Standby Settings
# ==========================================================================
hot_standby = on
hot_standby_feedback = on

# Connection info to primary (configured at runtime)
# primary_conninfo is set by pg_basebackup or recovery.conf

# ==========================================================================
# Query Settings for Read Replica
# ==========================================================================
# Allow queries to wait briefly if needed
max_standby_streaming_delay = 30s
max_standby_archive_delay = 30s

# ==========================================================================
# Query Planner Settings
# ==========================================================================
random_page_cost = 1.1
effective_io_concurrency = 200
max_parallel_workers_per_gather = 4
max_parallel_workers = 8

# ==========================================================================
# Logging Settings
# ==========================================================================
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB

log_min_duration_statement = 500
log_checkpoints = on
log_connections = on
log_disconnections = on

# ==========================================================================
# WAL Settings
# ==========================================================================
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5

# Archive mode (for cascading replication or PITR)
archive_mode = on
archive_command = '/bin/true'

# ==========================================================================
# Promote Trigger (for failover)
# ==========================================================================
# Touch this file to trigger promotion to primary
# promote_trigger_file = '/var/lib/postgresql/data/promote.trigger'

# ==========================================================================
# Security
# ==========================================================================
password_encryption = scram-sha-256
