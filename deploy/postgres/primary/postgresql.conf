# Arctic Text2SQL - PostgreSQL Primary Configuration
# Optimized for production with streaming replication

# ==========================================================================
# Connection Settings
# ==========================================================================
listen_addresses = '*'
port = 5432
max_connections = 200

# ==========================================================================
# Memory Settings
# ==========================================================================
# Adjust based on available RAM (these are for 8GB RAM)
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB

# Huge pages (Linux only, set to 'try' if not configured)
huge_pages = try

# ==========================================================================
# Write-Ahead Log (WAL) Settings
# ==========================================================================
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB

# WAL compression for reduced disk I/O
wal_compression = on

# Synchronous commit for data safety
synchronous_commit = on

# ==========================================================================
# Replication Settings
# ==========================================================================
# Enable hot standby for read replicas
hot_standby = on

# Archive mode for point-in-time recovery
archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/archive/%f'

# ==========================================================================
# Query Planner Settings
# ==========================================================================
random_page_cost = 1.1  # For SSD storage
effective_io_concurrency = 200  # For SSD storage

# Parallel query execution
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# ==========================================================================
# Logging Settings
# ==========================================================================
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# What to log
log_min_duration_statement = 500  # Log queries > 500ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0

# ==========================================================================
# Checkpoints and Background Writer
# ==========================================================================
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# ==========================================================================
# Autovacuum Settings
# ==========================================================================
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ==========================================================================
# Security Settings
# ==========================================================================
password_encryption = scram-sha-256

# SSL (enable in production)
# ssl = on
# ssl_cert_file = '/var/lib/postgresql/ssl/server.crt'
# ssl_key_file = '/var/lib/postgresql/ssl/server.key'

# ==========================================================================
# Statistics
# ==========================================================================
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all
