---
# Secret template - populate with actual values using kustomize or kubectl
# IMPORTANT: Do not commit actual secrets to version control!
apiVersion: v1
kind: Secret
metadata:
  name: arctic-text2sql-secrets
  namespace: arctic-text2sql
  labels:
    app.kubernetes.io/name: arctic-text2sql
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database - Replace with actual values or use external secret management
  DATABASE_URL: "postgresql://postgres:changeme@db:5432/text2sql"
  POSTGRES_PASSWORD: "changeme"

  # HuggingFace - Required for model download
  HUGGINGFACE_TOKEN: "hf_xxxxxxxxxxxxxxxxxxxx"

  # Security
  SECRET_KEY: "your-secure-secret-key-here"
---
