---
# Service Account for API pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arctic-text2sql
  namespace: arctic-text2sql
  labels:
    app.kubernetes.io/name: arctic-text2sql
    app.kubernetes.io/component: rbac
---
# Role for namespace-scoped permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arctic-text2sql
  namespace: arctic-text2sql
  labels:
    app.kubernetes.io/name: arctic-text2sql
    app.kubernetes.io/component: rbac
rules:
  # Allow reading config maps and secrets
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  # Allow pod introspection for health checks
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
# Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arctic-text2sql
  namespace: arctic-text2sql
  labels:
    app.kubernetes.io/name: arctic-text2sql
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arctic-text2sql
subjects:
  - kind: ServiceAccount
    name: arctic-text2sql
    namespace: arctic-text2sql
