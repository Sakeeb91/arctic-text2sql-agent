# Arctic Text2SQL - API Routing Configuration
# Server blocks, routing rules, and proxy settings

# ==========================================================================
# HTTP to HTTPS Redirect
# ==========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow health checks on HTTP
    location /health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================================================
# HTTPS Server Block
# ==========================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.text2sql.example.com;

    # SSL Certificates
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Trusted CA for OCSP stapling
    # ssl_trusted_certificate /etc/nginx/ssl/ca-bundle.crt;

    # ==========================================================================
    # Security Headers
    # ==========================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;

    # ==========================================================================
    # Common Proxy Headers
    # ==========================================================================
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    # ==========================================================================
    # Blocked Requests
    # ==========================================================================
    if ($blocked_request) {
        return 444;
    }

    # ==========================================================================
    # API v1 Routes
    # ==========================================================================

    # Health check (no rate limiting)
    location = /api/v1/health {
        proxy_pass http://arctic_api;
        proxy_read_timeout 5s;
        limit_req off;
        limit_conn off;
    }

    # Query endpoint (main Text2SQL functionality)
    location /api/v1/query {
        # Apply rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        # Longer timeout for ML inference
        proxy_read_timeout 120s;

        proxy_pass http://arctic_api;
    }

    # Schema endpoint
    location /api/v1/schema {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://arctic_api;
    }

    # Validation endpoint
    location /api/v1/validate {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://arctic_api;
    }

    # Agent endpoints
    location /api/v1/agent/ {
        limit_req zone=api_limit burst=15 nodelay;
        proxy_read_timeout 180s;  # Agent may take longer
        proxy_pass http://arctic_api;
    }

    # Authentication endpoints
    location /api/v1/auth/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://arctic_api;
    }

    # Default API route
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;
        proxy_pass http://arctic_api;
    }

    # ==========================================================================
    # Streaming Support (SSE)
    # ==========================================================================
    location ~ ^/api/v1/(query|agent)/stream {
        proxy_pass http://arctic_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ==========================================================================
    # Monitoring Endpoints (Internal Only)
    # ==========================================================================
    location /monitoring/metrics {
        # Restrict to internal networks
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://monitoring_api;
        limit_req off;
    }

    location /monitoring/health {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://monitoring_api;
        limit_req off;
    }

    # ==========================================================================
    # Error Pages
    # ==========================================================================
    error_page 500 502 503 504 /50x.json;
    location = /50x.json {
        default_type application/json;
        return 503 '{"error": "Service temporarily unavailable", "code": "SERVICE_UNAVAILABLE"}';
    }

    error_page 429 /429.json;
    location = /429.json {
        default_type application/json;
        return 429 '{"error": "Too many requests", "code": "RATE_LIMITED"}';
    }

    # ==========================================================================
    # Status Endpoint (for monitoring Nginx itself)
    # ==========================================================================
    location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }

    # ==========================================================================
    # Default Handler
    # ==========================================================================
    location / {
        return 404 '{"error": "Not found", "code": "NOT_FOUND"}';
        default_type application/json;
    }
}
