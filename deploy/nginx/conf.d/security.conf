# Arctic Text2SQL - Security Configuration
# Rate limiting, request filtering, and access control

# ==========================================================================
# Rate Limiting Zones
# ==========================================================================

# Per-IP rate limiting for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Per-token rate limiting for authenticated requests
limit_req_zone $http_authorization zone=auth_limit:10m rate=100r/s;

# Connection limiting per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ==========================================================================
# Request Size Limits
# ==========================================================================

# Maximum request body size (for SQL queries)
client_max_body_size 10m;

# ==========================================================================
# Blocked Patterns
# ==========================================================================

# Block common attack patterns
map $request_uri $blocked_request {
    default 0;
    ~*\.(php|asp|aspx|jsp|cgi)$ 1;
    ~*/wp-admin 1;
    ~*/wp-content 1;
    ~*/wp-includes 1;
    ~*\.\./ 1;
    ~*<script 1;
    ~*%00 1;
}

# ==========================================================================
# GeoIP Blocking (optional - requires geoip module)
# ==========================================================================

# Uncomment to enable geo-blocking
# geo $blocked_country {
#     default 0;
#     # Block specific countries if needed
#     # XX 1;
# }

# ==========================================================================
# Bot Detection
# ==========================================================================

# Identify and potentially block bad bots
map $http_user_agent $bad_bot {
    default 0;
    ~*curl 0;  # Allow curl for testing
    ~*wget 0;  # Allow wget
    ~*python-requests 0;  # Allow Python requests
    ~*^$ 1;  # Block empty user agents
    ~*bot 0;  # Allow most bots (adjust as needed)
}

# ==========================================================================
# Request ID Generation
# ==========================================================================

# Generate unique request ID for tracing
map $request_id $req_id {
    default $request_id;
    "" $pid-$msec-$remote_addr;
}
