# Arctic Text2SQL - Upstream Server Configuration
# Defines backend API server pools with health checking

# ==========================================================================
# API Backend Pool
# ==========================================================================
upstream arctic_api {
    # Load balancing method: least connections for ML workloads
    # (variable response times due to model inference)
    least_conn;

    # Keep connections alive to reduce overhead
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;

    # Backend servers
    # In production, these would be dynamically configured or use DNS
    server api-1:8000 weight=1 max_fails=3 fail_timeout=30s;
    server api-2:8000 weight=1 max_fails=3 fail_timeout=30s;
    # Backup server activated only when primaries fail
    # server api-3:8000 weight=1 max_fails=3 fail_timeout=30s backup;

    # For single instance development/testing
    # server api:8000;
}

# ==========================================================================
# Monitoring Backend (internal access only)
# ==========================================================================
upstream monitoring_api {
    server api-1:8000;
    keepalive 4;
}
