# Arctic Text2SQL - SSL/TLS Configuration
# Security-focused SSL settings for production deployment

# ==========================================================================
# SSL Protocol Settings
# ==========================================================================

# Only allow TLS 1.2 and 1.3 (disable older protocols)
ssl_protocols TLSv1.2 TLSv1.3;

# Modern cipher suite prioritizing security and performance
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# Let server choose the cipher (more secure)
ssl_prefer_server_ciphers on;

# ==========================================================================
# SSL Session Settings
# ==========================================================================

# Session caching for performance (shared across workers)
ssl_session_cache shared:SSL:50m;
ssl_session_timeout 1d;

# Disable session tickets for better forward secrecy
ssl_session_tickets off;

# ==========================================================================
# OCSP Stapling
# ==========================================================================

# Enable OCSP stapling for faster certificate validation
ssl_stapling on;
ssl_stapling_verify on;

# DNS resolver for OCSP
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# ==========================================================================
# Diffie-Hellman Parameters
# ==========================================================================

# Strong DH parameters (generate with: openssl dhparam -out dhparam.pem 4096)
ssl_dhparam /etc/nginx/ssl/dhparam.pem;

# ==========================================================================
# ECDH Curve
# ==========================================================================

# Use modern elliptic curve
ssl_ecdh_curve secp384r1;
